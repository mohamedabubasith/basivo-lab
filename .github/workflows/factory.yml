# Copy to .github/workflows/factory.yml in a target repo whose tickets live in Jira.
# Jira Automation starts it with a web request (see docs/ARCHITECTURE.md, "Setup"):
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/factory.yml/dispatches
#   {"ref": "main", "inputs": {"ticket": "{{issue.key}}", "run": "plan"}}     ticket moved to Selected for Development
#   {"ref": "main", "inputs": {"ticket": "{{issue.key}}", "run": "build"}}    "/approve" comment
# The token Jira uses only needs "Actions: read and write" on this one repo: it can start this workflow,
# not change code. You can also start it by hand from the Actions tab.
name: factory
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Jira key, for example BL-7
        required: true
      run:
        description: Which part to run
        type: choice
        options: [plan, build]
        default: plan

permissions:
  contents: write
  issues: write
  pull-requests: write

# One run per ticket at a time; a second trigger waits for the first.
concurrency:
  group: factory-${{ inputs.ticket }}

jobs:
  pipeline:
    uses: mohamedabubasith/basivo-factory/.github/workflows/pipeline.yml@main
    with:
      ticket: ${{ inputs.ticket }}
      run: ${{ inputs.run }}
      jira_url: ${{ vars.JIRA_BASE_URL }}
      jira_email: ${{ vars.JIRA_EMAIL }}
    secrets: inherit
